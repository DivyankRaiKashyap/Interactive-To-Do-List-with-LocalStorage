```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interactive To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <p class="subtitle">
            Manage your daily tasks
        </p>


        <!-- Input Section -->

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


        <!-- Task Counter -->

        <div class="task-info">

            <span id="taskCount">
                0 tasks
            </span>

            <button id="clearButton">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
